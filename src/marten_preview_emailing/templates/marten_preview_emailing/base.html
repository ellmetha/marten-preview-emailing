<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>{% block title %}Email previews{% endblock %}</title>
    <style type="text/css">
      body {
        margin: 0;
        font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
        font-size: 14px;
        color: #222;
        background: #f7f7f7;
      }
      a {
        color: #09c;
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
      {% block extra_styles %}{% endblock %}
    </style>
  </head>
  <body>
    {% block toolbar %}{% endblock %}
    {% block header %}{% endblock %}
    {% block content %}{% endblock %}
  </body>
</html>
